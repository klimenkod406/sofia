<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Σόφια - Modern note-taking app with AI-powered transcription and analysis" />
    <title>Σόφια</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Типографика: Manrope (заголовки), Onest (текст), JetBrains Mono (код).
         Все три — с кириллицей и латиницей, гротески без вязи, визуально лёгкие. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <!-- Цвет body и <div id="root"> совпадают с `windows[0].backgroundColor`
       в tauri.conf.json. До того, как React смонтируется, Tauri рисует
       WebView этим тёплым кремовым — благодаря этому на холодном старте
       нет ни белой вспышки, ни «прозрачной рамки», через которую
       просвечивает рабочий стол. -->
  <body class="h-full m-0 bg-background text-foreground antialiased" style="background-color:#F8F5F1;">
    <div id="root" class="h-full" style="background-color:#F8F5F1;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
